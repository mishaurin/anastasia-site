[build]
  publish = "."

# ── Фото: базовая защита. Индексацию фото НЕ запрещаем (X-Robots-Tag убран),
#    чтобы работы Анастасии находились в Google Images и превью в соцсетях работали ──
[[headers]]
  for = "/photos/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ── Основные заголовки безопасности ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ── HTML и JSON всегда свежие ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/photos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hero.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Служебные файлы репозитория не должны открываться на сайте ──
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/check-photos.js*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.impeccable/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/https___*"
  to = "/404.html"
  status = 404
  force = true
